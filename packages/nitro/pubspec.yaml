name: nitro
description: >
  High-performance Native Modules for Flutter (Nitro Modules equivalent).
  Runtime support for .native.dart spec generated bridges.
version: 0.8.1
homepage: https://nitro.shreeman.dev
repository: https://github.com/Shreemanarjun/nitro_ecosystem
issue_tracker: https://github.com/Shreemanarjun/nitro_ecosystem/issues
documentation: https://nitro.shreeman.dev/
funding:
  - https://buymeacoffee.com/shreemanarjun
topics:
  - ffi
  - flutter
  - native
  - bridge
  - high-performance

environment:
  sdk: ^3.11.3
resolution: workspace

# Pure-Dart runtime: no Flutter SDK dependency and no `flutter.plugin` block, so
# `dart pub add nitro` works in a non-Flutter project (dart run / compile / test).
# nitro ships no built native lib — consumers (generated Nitro plugins,
# nitro_camera, …) vendor its `src/` headers via `nitrogen link` and compile them
# in their own native build.
dependencies:
  ffi: ^2.2.0
  nitro_annotations: ^0.8.1
  meta: ^1.17.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  nitro_generator: ^0.8.1
  test: ^1.31.1
  ffi_leak_tracker: ^0.1.2
  leak_tracker: ^11.0.0

# No `flutter:` section: nitro is a pure-Dart package with no plugin block and no
# native build of its own. Consumers build the vendored native runtime (see the
# `environment` note above and the README).
