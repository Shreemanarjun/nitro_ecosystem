name: benchmark
resolution: workspace
description: "Nitro benchmark plugin for measuring FFI bridge performance."
version: 0.3.3
publish_to: 'none'
homepage: https://nitro.shreeman.dev
repository: https://github.com/Shreemanarjun/nitro_ecosystem

environment:
  sdk: ^3.11.3
  flutter: '>=3.3.0'

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  nitro:
    path: ../packages/nitro
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  nitro_generator:
    path: ../packages/nitro_generator

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      android:
        pluginClass: BenchmarkPlugin
        package: dev.shreeman.benchmark
        ffiPlugin: true
      ios:
        pluginClass: SwiftBenchmarkPlugin
      macos:
        pluginClass: BenchmarkPlugin
      windows:
        pluginClass: BenchmarkPluginCApi
      linux:
        pluginClass: BenchmarkPlugin
      web:
        # Pure-Dart stub implementation — no native bridge on web.
        # Results serve as a baseline "pure Dart dispatch" reference.
        pluginClass: BenchmarkWebPlugin
        fileName: src/benchmark_web_plugin.dart


