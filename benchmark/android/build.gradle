plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "dev.shreeman.benchmark"
version = "1.0"

android {
    namespace = "dev.shreeman.benchmark"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    externalNativeBuild {
        cmake { path = "../src/CMakeLists.txt" }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        // Flutter's profile variant: without an explicit profile buildType,
        // AGP builds the plugin's CMake code with the DEBUG config — the
        // whole native library ships at -O0 in profile mode (verified at the
        // binary level: exported functions become unoptimized call shims).
        // Inherit release so profile measures optimized native code.
        profile {
            initWith release
        }
    }

    defaultConfig {
            consumerProguardFiles "consumer-rules.pro"
 minSdk = 24 }

    sourceSets {
        main {
            // Kotlin-generated bridges live here. Do NOT add to java.srcDirs —
            // in AGP 8.x that routes .kt files through the Java compiler path
            // and causes "Unresolved reference: XxxJniBridge" compile errors.
            kotlin.srcDirs += "${project.projectDir}/../lib/src/generated/kotlin"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
}
