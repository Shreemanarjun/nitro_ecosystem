# CI — Cross-bridge performance regression gate (S7-P2)
#
# Runs one benchmark suite (raw FFI vs Nitro paths vs MethodChannel) across
# every embedder: macOS, Linux, Windows, Android, iOS — and the browser, where
# the same harness goes through the WASM bridge under both web compilers.
#
# Machine-independent bridge-tier ratios are enforced where the tiers exist:
#   * Nitro leaf call stays within 2.5× of the raw FFI floor
#   * Nitro checked call stays within 4× of the raw FFI floor
#   * Nitro stays ≥5× faster than MethodChannel
# A platform that lacks a tier auto-skips that ratio rather than failing — web
# has neither raw FFI nor MethodChannel — while the core Nitro cases stay
# mandatory everywhere, which is what catches a broken bridge.
#
# Absolute-µs baselines are NOT gated here — shared runners are too noisy.
# Record/gate those on dedicated hardware via:
#   benchmark/tool/bench.sh --mode full --gate all
#
# Trigger: push to main + manual dispatch (not PRs — a full desktop build per
# PR is slow, and the ratio gate on main catches regressions before release).

name: Benchmark CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmark/**'
      - '.github/workflows/ci_benchmark.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Iteration scale'
        type: choice
        options: [quick, full]
        default: quick

jobs:
  bench-macos:
    name: macOS — FFI vs Nitro vs MethodChannel
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run benchmark with relative regression gate
        run: >
          bash benchmark/tool/bench.sh -d macos
          --mode ${{ github.event.inputs.mode || 'quick' }}
          --gate relative

      - name: Publish analysis to job summary
        if: always()
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --baselines-dir benchmark/example/assets/baselines \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-macos
          path: benchmark/results/
          if-no-files-found: ignore

  # ── Web: the same harness through the WASM bridge, in a real browser ──────
  # Runs the identical regression test the native jobs use, driven over
  # chromedriver against a profile build. There is no raw-FFI tier and no
  # MethodChannel on web, so the ratio gates auto-skip; the core Nitro cases
  # stay mandatory, which is what catches a broken web bridge.
  #
  # Both compilers are measured because they differ enormously at the bridge
  # boundary — dart2js `.toDart` is a cast, dart2wasm's is a copy — so a
  # single number would hide a regression in whichever one it did not run.
  bench-web:
    name: Web — Nitro C++ via WASM (dart2js + dart2wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: dart2js
            wasm_flag: ''
          - compiler: dart2wasm
            wasm_flag: '--wasm'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      # Chrome and chromedriver must be the SAME milestone or webdriver refuses
      # the session ("only supports Chrome version N"). `stable` is not enough:
      # it resolved to Chrome 151 and chromedriver 152 in the same run. Pinning
      # an explicit milestone makes both resolve from one Chrome-for-Testing
      # release. Bump this number; never split it across the two artifacts.
      # Both versions are echoed below so a future drift is one glance away.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '152'
          install-chromedriver: true

      - name: Get workspace dependencies
        run: flutter pub get

      # The harness calls into benchmark_cpp.wasm; without it the app boots
      # into a startup error and every Nitro case would be "skipped".
      - name: Build benchmark_cpp.wasm
        working-directory: benchmark
        run: bash web/build_web.sh

      # chromedriver launches the browser itself and finds it by looking up
      # `google-chrome` on PATH — it ignores CHROME_EXECUTABLE, which only
      # steers flutter_tools. The runner image ships its own Chrome, so without
      # this the pinned driver still drives the image's mismatched browser.
      - name: Put the pinned Chrome first on PATH
        run: |
          mkdir -p "$HOME/chrome-bin"
          for n in google-chrome google-chrome-stable chrome chromium; do
            ln -sf "${{ steps.chrome.outputs.chrome-path }}" "$HOME/chrome-bin/$n"
          done
          echo "$HOME/chrome-bin" >> "$GITHUB_PATH"

      - name: Start chromedriver
        run: |
          command -v google-chrome
          google-chrome --version
          "${{ steps.chrome.outputs.chromedriver-path }}" --version
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=4444 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "chromedriver did not become ready" >&2
          exit 1

      # --profile, never debug: a DDC/debug build measures the compiler, not
      # the bridge. The driver writes build/integration_response_data.json.
      - name: Run benchmark + regression gate (${{ matrix.compiler }})
        working-directory: benchmark/example
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: >
          flutter drive --profile ${{ matrix.wasm_flag }}
          --driver=test_driver/integration_test.dart
          --target=integration_test/benchmark_regression_test.dart
          -d web-server --browser-name=chrome --headless
          --dart-define=NITRO_BENCH_MODE=${{ github.event.inputs.mode || 'quick' }}
          --dart-define=NITRO_BENCH_GATE=relative

      - name: Publish analysis to job summary
        if: always()
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --baselines-dir benchmark/example/assets/baselines \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-web-${{ matrix.compiler }}
          path: benchmark/results/
          if-no-files-found: ignore

  # ── Desktop C++ tiers: Linux (GTK) and Windows (MSVC) ─────────────────────
  # These run the same harness — MethodChannel and platform-bridge cases that
  # a platform doesn't implement are auto-skipped and reported as such, while
  # the core Nitro-vs-raw-FFI gates stay mandatory everywhere.

  bench-linux:
    name: Linux — FFI vs Nitro vs MethodChannel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Newly wired platform — observe before making it required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run benchmark with relative regression gate (headless)
        run: >
          xvfb-run -a bash benchmark/tool/bench.sh -d linux
          --mode ${{ github.event.inputs.mode || 'quick' }}
          --gate relative

      - name: Probe native module libs (diagnose crash)
        if: failure()
        run: |
          BUNDLE=benchmark/example/build/linux/x64/profile/bundle/lib
          ls -la "$BUNDLE" 2>/dev/null || echo "bundle lib dir missing"
          dart benchmark/tool/probe_desktop.dart "$BUNDLE" || true

      - name: Publish analysis to job summary
        if: always()
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --baselines-dir benchmark/example/assets/baselines \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-linux
          path: benchmark/results/
          if-no-files-found: ignore

  # ── Mobile: Android emulator + iOS simulator ───────────────────────────────
  # Emulators/simulators cannot run profile builds, so these legs are
  # FUNCTIONAL verification (debug, --gate none): every bridge tier must run
  # and all tiers must return the identical FNV-1a workload hash — a mismatch
  # fails the run inside the harness regardless of the gate setting. Real
  # performance numbers come from physical devices:
  #   benchmark/tool/bench.sh -d <device-id> --mode full --update-baseline

  bench-android:
    name: Android (emulator) — functional verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Newly wired platform — observe before making it required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run benchmark on emulator (debug, functional + hash verification)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash benchmark/tool/bench.sh -d emulator-5554 --debug --gate none --mode quick

      - name: Publish analysis to job summary
        if: always()
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-android
          path: benchmark/results/
          if-no-files-found: ignore

  bench-ios:
    name: iOS (simulator) — functional verification
    runs-on: macos-latest
    timeout-minutes: 45
    # Newly wired platform — observe before making it required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); raise SystemExit
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Start from a known-clean simulator: a leftover booted device is one
          # of the states where the app builds but never launches.
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # The app intermittently builds fine and then never starts — no output at
      # all until the job timeout. Bound the attempt so a hang costs minutes
      # instead of the job's full 45, then retry once from a fresh simulator;
      # observed runs either start promptly (~13 min end-to-end) or never.
      - name: Run benchmark on simulator (debug, functional + hash verification)
        id: bench
        continue-on-error: true
        timeout-minutes: 20
        run: >
          bash benchmark/tool/bench.sh -d ${{ steps.sim.outputs.udid }}
          --debug --gate none --mode quick

      - name: Retry once on a fresh simulator
        if: steps.bench.outcome == 'failure'
        timeout-minutes: 20
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          bash benchmark/tool/bench.sh -d ${{ steps.sim.outputs.udid }} \
            --debug --gate none --mode quick

      - name: Publish analysis to job summary
        if: always()
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-ios
          path: benchmark/results/
          if-no-files-found: ignore

  bench-windows:
    name: Windows — FFI vs Nitro vs MethodChannel
    runs-on: windows-latest
    timeout-minutes: 45
    # Newly wired platform — observe before making it required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run benchmark with relative regression gate
        shell: bash
        run: >
          bash benchmark/tool/bench.sh -d windows
          --mode ${{ github.event.inputs.mode || 'quick' }}
          --gate relative

      - name: Probe native module libs (diagnose crash)
        if: failure()
        shell: bash
        run: |
          BUNDLE=benchmark/example/build/windows/x64/runner/Profile
          ls -la "$BUNDLE" 2>/dev/null || echo "bundle dir missing"
          dart benchmark/tool/probe_desktop.dart "$BUNDLE" || true

      - name: Publish analysis to job summary
        if: always()
        shell: bash
        run: |
          if [ -f benchmark/example/build/integration_response_data.json ]; then
            dart run benchmark/tool/format_report.dart \
              benchmark/example/build/integration_response_data.json \
              --baselines-dir benchmark/example/assets/baselines \
              --compare-dir benchmark/results \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-windows
          path: benchmark/results/
          if-no-files-found: ignore
