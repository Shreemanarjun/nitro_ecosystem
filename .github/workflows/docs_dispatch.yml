# Tell the docs site (Shreemanarjun/nitro_docs) to re-sync when anything it
# mirrors or extracts facts from changes on main. The docs workflow also runs
# nightly, so a missed dispatch is caught within a day.
#
# Requires the DOCS_DISPATCH_TOKEN secret: a fine-grained personal access
# token scoped to the nitro_docs repository with "Contents: Read and write"
# (repository_dispatch needs write access on the receiving repo).
name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "doc/**"
      - "migration/**"
      - "packages/*/README.md"
      - "packages/*/CHANGELOG.md"
      - "packages/*/pubspec.yaml"
      - "packages/nitro_annotations/lib/**"
      - "packages/nitro/lib/src/nitro_config.dart"
      - "packages/nitro_generator/lib/src/spec_validator.dart"
      - "packages/nitrogen_cli/bin/**"
      - "packages/nitrogen_cli/lib/commands/**"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: Shreemanarjun/nitro_docs
          event-type: nitro-ecosystem-updated
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref_name }}"}'
