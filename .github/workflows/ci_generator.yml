# CI — Generator unit tests + runtime tests
#
# Runs the full nitro_generator test suite (2900+ tests) and the nitro runtime
# tests (100 tests) on every push and pull request. These tests run on Ubuntu
# for speed and cover all generators, callback types, S8 out-param ABI, web
# bridge, NativeHandle, and all platform combinations.

name: Generator & Runtime CI

on:
  push:
    branches: [main, 'refactor-*', 'feature-*']
  pull_request:
    branches: [main]

jobs:
  generator:
    name: nitro_generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolve the full workspace from the root so every member is available.
      # Running pub get from a sub-package would fail because the root
      # pubspec.yaml declares workspace members that CI must be able to locate.
      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run nitro_generator tests
        run: flutter test --reporter expanded
        working-directory: packages/nitro_generator

      # Text assertions cannot catch "this does not build" — issue #40 shipped
      # JNI code in a JNI-free bridge that looked correct but never compiled.
      - name: Verify generated C++ bridges compile
        run: dart run tool/verify_cpp_bridge_compiles.dart
        working-directory: packages/nitro_generator

  runtime:
    name: nitro runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run nitro runtime tests
        run: flutter test --reporter expanded
        working-directory: packages/nitro

  analyze:
    name: dart analyze (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      # Nothing gated analysis before, so a test that only ever ran under
      # `-p chrome` could sit broken for the analyzer indefinitely: package:nitro
      # exports NitroRuntime CONDITIONALLY, and analysis resolves the VM branch,
      # so a web-only API referenced through the barrel compiles for the browser
      # but is an undefined_method to `dart analyze`.
      - name: Analyze every package
        run: |
          fail=0
          for d in packages/nitro packages/nitro_annotations packages/nitro_generator \
                   packages/nitrogen_cli e2e/nitro_web_e2e benchmark benchmark/example; do
            [ -f "$d/pubspec.yaml" ] || continue
            echo "── $d"
            (cd "$d" && dart analyze) || fail=1
          done
          exit $fail

  cli:
    name: nitrogen_cli tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      # The CLI owns the init/link/doctor/generate wiring AND the guards that
      # catch stale output, a drifted --version and the Emscripten-only header
      # leaking into Apple SwiftPM targets. None of that was covered by CI.
      - name: Run nitrogen_cli tests
        run: flutter test --reporter expanded
        working-directory: packages/nitrogen_cli

  build-yaml-drift:
    name: build.yaml drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Verify build.yaml matches build_extensions
        run: flutter test test/build_yaml_drift_test.dart
        working-directory: packages/nitro_generator
