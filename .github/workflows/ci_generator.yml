# CI — Generator unit tests + runtime tests
#
# Runs the full nitro_generator test suite (2900+ tests) and the nitro runtime
# tests (100 tests) on every push and pull request. These tests run on Ubuntu
# for speed and cover all generators, callback types, S8 out-param ABI, web
# bridge, NativeHandle, and all platform combinations.

name: Generator & Runtime CI

on:
  push:
    branches: [main, 'refactor-*', 'feature-*', 'perf-*', 'perf/*']
  pull_request:
    branches: [main]

jobs:
  generator:
    name: nitro_generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolve the full workspace from the root so every member is available.
      # Running pub get from a sub-package would fail because the root
      # pubspec.yaml declares workspace members that CI must be able to locate.
      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run nitro_generator tests
        run: flutter test --reporter expanded
        working-directory: packages/nitro_generator

      # Text assertions cannot catch "this does not build" — issue #40 shipped
      # JNI code in a JNI-free bridge that looked correct but never compiled.
      - name: Verify generated C++ bridges compile
        run: dart run tool/verify_cpp_bridge_compiles.dart
        working-directory: packages/nitro_generator

      # Same rationale for the native-assets (@Native) path: string-assertion
      # unit tests prove WHAT is emitted, not that it COMPILES. This generates a
      # comprehensive all-C++ spec on the @Native path and `dart analyze`s the
      # emitted Dart against the real nitro runtime (catches a bad external
      # signature / arity desync / wrong FFI type that a `contains(...)` misses).
      - name: Verify native-assets emit analyzes
        run: dart run tool/verify_native_assets_analyzes.dart
        working-directory: packages/nitro_generator

      # Every always-regenerated file carries the spec-sha256 stamp so
      # `nitrogen generate --check` can distinguish committed output from drift
      # (#42). Prove the current generator's FRESH output actually passes that
      # gate end-to-end: a regression that drops the stamp, emits non-idempotent
      # output, or re-breaks the editable-starter exclusion turns this red.
      # Ephemeral regen — the runner tree is throwaway.
      - name: nitrogen generate --check is clean on fresh output
        working-directory: packages/nitro/example
        run: |
          dart run nitrogen_cli:nitrogen clean --no-ui
          dart run nitrogen_cli:nitrogen generate --no-ui
          dart run nitrogen_cli:nitrogen generate --check --no-ui

  # Lever-2 zero-copy ratio gate (W4). Pure Dart — no Flutter: the microbench is
  # self-contained (only dart:ffi/io/typed_data), so it runs under the plain Dart
  # SDK as a standalone script. Copied out of the Flutter pub workspace so no
  # `pub get` drags Flutter in. (It measures the malloc+memcpy+free that
  # `.address` eliminates — true `.address` needs the native-assets build.)
  zero-copy-gate:
    name: zero-copy ratio gate (pure Dart, no Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run the gate as a standalone script
        run: |
          cp benchmark/tool/zero_copy_microbench.dart "$RUNNER_TEMP/zc.dart"
          dart run "$RUNNER_TEMP/zc.dart"

  runtime:
    name: nitro runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Run nitro runtime tests
        run: flutter test --reporter expanded
        working-directory: packages/nitro

  analyze:
    name: dart analyze (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      # Nothing gated analysis before, so a test that only ever ran under
      # `-p chrome` could sit broken for the analyzer indefinitely: package:nitro
      # exports NitroRuntime CONDITIONALLY, and analysis resolves the VM branch,
      # so a web-only API referenced through the barrel compiles for the browser
      # but is an undefined_method to `dart analyze`.
      - name: Analyze every package
        run: |
          fail=0
          for d in packages/nitro packages/nitro_annotations packages/nitro_generator \
                   packages/nitrogen_cli e2e/nitro_web_e2e benchmark benchmark/example; do
            [ -f "$d/pubspec.yaml" ] || continue
            echo "── $d"
            (cd "$d" && dart analyze) || fail=1
          done
          exit $fail

  cli:
    name: nitrogen_cli tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      # The CLI owns the init/link/doctor/generate wiring AND the guards that
      # catch stale output, a drifted --version and the Emscripten-only header
      # leaking into Apple SwiftPM targets. None of that was covered by CI.
      - name: Run nitrogen_cli tests
        run: flutter test --reporter expanded
        working-directory: packages/nitrogen_cli

  build-yaml-drift:
    name: build.yaml drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get workspace dependencies
        run: flutter pub get

      - name: Verify build.yaml matches build_extensions
        run: flutter test test/build_yaml_drift_test.dart
        working-directory: packages/nitro_generator
