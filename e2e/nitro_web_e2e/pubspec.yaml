name: nitro_web_e2e
description: >-
  End-to-end browser test for nitro's WASM web bridge: a real spec, a real C++
  impl compiled with Emscripten, driven through the generated web bridge under
  dart test -p chrome (dart2js) and -c dart2wasm.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.3

dependencies:
  nitro: ^0.7.0
  nitro_annotations: ^0.7.0

dev_dependencies:
  build_runner: ^2.4.13
  nitro_generator: ^0.7.0
  stream_channel: ^2.1.2
  test: ^1.25.8
